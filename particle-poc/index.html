<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mockingbird Particle Interface</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0f;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #canvas-container {
    position: fixed;
    inset: 0;
  }
  canvas { display: block; }

  #hud {
    position: fixed;
    left: 50%;
    bottom: 36px;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    z-index: 10;
    width: min(560px, 90vw);
  }

  #response-box {
    width: 100%;
    box-sizing: border-box;
    max-height: 160px;
    overflow-y: auto;
    background: rgba(10, 14, 20, 0.6);
    border: 1px solid rgba(0, 212, 255, 0.35);
    border-radius: 14px;
    padding: 14px 18px;
    color: #d6f6ff;
    font-size: 14px;
    line-height: 1.5;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 18px rgba(0, 170, 255, 0.12), inset 0 0 12px rgba(0, 170, 255, 0.06);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.3s ease;
    pointer-events: none;
  }
  #response-box.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  #response-box.error {
    border-color: rgba(255, 90, 90, 0.55);
    color: #ffd6d6;
    box-shadow: 0 0 18px rgba(255, 60, 60, 0.12), inset 0 0 12px rgba(255, 60, 60, 0.06);
  }

  #chat-form {
    width: 100%;
    display: flex;
    gap: 10px;
  }

  #chat-input {
    flex: 1;
    background: rgba(10, 14, 20, 0.55);
    border: 1px solid rgba(0, 212, 255, 0.45);
    color: #eafcff;
    font-size: 14px;
    padding: 12px 18px;
    border-radius: 999px;
    outline: none;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 18px rgba(0, 170, 255, 0.15), inset 0 0 12px rgba(0, 170, 255, 0.08);
    transition: box-shadow 0.25s ease, border-color 0.25s ease;
  }
  #chat-input::placeholder { color: rgba(190, 230, 245, 0.4); }
  #chat-input:focus {
    border-color: rgba(0, 212, 255, 0.9);
    box-shadow: 0 0 26px rgba(0, 200, 255, 0.3), inset 0 0 14px rgba(0, 200, 255, 0.12);
  }

  #send-btn {
    background: rgba(10, 14, 20, 0.55);
    border: 1px solid rgba(0, 212, 255, 0.45);
    color: #bdf3ff;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 22px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 18px rgba(0, 170, 255, 0.15), inset 0 0 12px rgba(0, 170, 255, 0.08);
    transition: box-shadow 0.25s ease, border-color 0.25s ease, transform 0.15s ease, opacity 0.2s ease;
  }
  #send-btn:hover { border-color: rgba(0, 212, 255, 0.9); }
  #send-btn:active { transform: scale(0.97); }
  #send-btn:disabled { opacity: 0.45; cursor: default; }

  #status {
    position: fixed;
    top: 18px;
    left: 18px;
    color: rgba(140, 200, 220, 0.55);
    font-size: 11px;
    letter-spacing: 0.05em;
    z-index: 10;
    line-height: 1.6;
  }
  #status span { color: #6be8ff; }

  #settings {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    background: rgba(10, 14, 20, 0.5);
    border: 1px solid rgba(0, 212, 255, 0.25);
    border-radius: 12px;
    padding: 10px 14px;
    backdrop-filter: blur(6px);
    font-size: 11px;
    color: rgba(160, 210, 230, 0.7);
    letter-spacing: 0.04em;
  }
  #settings .row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #voice-engine {
    background: rgba(10, 14, 20, 0.7);
    border: 1px solid rgba(0, 212, 255, 0.4);
    color: #d6f6ff;
    font-size: 11px;
    border-radius: 6px;
    padding: 3px 6px;
  }
  #hum-toggle {
    background: transparent;
    border: 1px solid rgba(0, 212, 255, 0.4);
    color: #d6f6ff;
    border-radius: 6px;
    padding: 2px 8px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1.4;
  }
  #hum-toggle:hover { border-color: rgba(0, 212, 255, 0.9); }
  #hum-volume { width: 70px; accent-color: #00d4ff; }
</style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="status">
    state: <span id="state-label">idle</span><br/>
    shape: <span id="shape-label">sphere</span><br/>
    fps: <span id="fps-label">--</span><br/>
    hover: <span id="hover-label">no</span><br/>
    voice: <span id="voice-status-label">free</span>
  </div>

  <div id="settings">
    <div class="row">
      <label for="voice-engine">Voice:</label>
      <select id="voice-engine">
        <option value="free" selected>Free</option>
        <option value="premium">Premium</option>
      </select>
    </div>
    <div class="row">
      <button id="hum-toggle" type="button" title="Toggle ambient hum">🔊</button>
      <input id="hum-volume" type="range" min="0" max="0.08" step="0.005" value="0.035" title="Ambient hum volume" />
    </div>
  </div>

  <div id="hud">
    <div id="response-box"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Talk to Mockingbird…" autocomplete="off" />
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>

  <!--
    Three.js is loaded locally from ./vendor/three.module.min.js (r160).
    No npm install / build step is required to view this page — just serve
    this folder statically and open index.html. To use a CDN instead, swap
    the import path below for e.g.
    "https://unpkg.com/three@0.160.0/build/three.module.js".
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js"
    }
  }
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
